<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490" role="img" aria-label="About Devraj Bijpuria"><title>sys/about — Devraj Bijpuria</title><style>@font-face{font-family:'GM';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'GMB';src:url(data:font/woff2;base64,) format('woff2');}.tb{font:600 12px 'GMB',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#ece5d4;letter-spacing:.14em;text-transform:uppercase}.st{font:11px 'GM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9d9784;letter-spacing:.14em;text-transform:uppercase}.lab{font:11px 'GM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9d9784;letter-spacing:.3em;text-transform:uppercase}.h1{font:600 34px 'GMB',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#ece5d4;letter-spacing:.06em}.acc{font:13px 'GM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#A8AEF5;letter-spacing:.24em}.p{font:15px 'GM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d8d1bf}.dim{fill:#9d9784}@keyframes t{to{transform:scaleX(1)}}@keyframes b{50%{opacity:0}}.cur{animation:b 1s steps(1) infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity=".22"/></pattern><radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".55"/></radialGradient></defs><rect width="1200" height="490" rx="14" fill="#14150f"/><rect x="4" y="4" width="1192" height="482" rx="11" fill="none" stroke="#3a3c30" stroke-width="2"/><rect x="10" y="10" width="1180" height="28" fill="#2a2c22"/><rect x="18" y="17" width="14" height="14" fill="#1c1f14" stroke="#ece5d4" stroke-opacity=".35"/><text x="42" y="29" class="tb">sys/about.exe</text><g transform="translate(1122 17)"><rect width="14" height="14" fill="#1c1f14" stroke="#ece5d4" stroke-opacity=".35"/><rect x="20" width="14" height="14" fill="#1c1f14" stroke="#ece5d4" stroke-opacity=".35"/><rect x="40" width="14" height="14" fill="#1c1f14" stroke="#ece5d4" stroke-opacity=".35"/><text x="47" y="11" class="tb" text-anchor="middle">×</text></g><rect x="10" y="38" width="1180" height="408" fill="#0c0d09"/><text x="44" y="80" class="lab">whoami</text><text x="44" y="118" class="h1">DEVRAJ BIJPURIA</text><text x="1156" y="118" class="acc" text-anchor="end">DATA ENGINEERING · ML</text><rect x="44" y="132" width="1112" height="1" fill="#ece5d4" opacity=".14"/><g clip-path="url(#c0)"><text x="44" y="164" class="p">I'm Devraj, a Computer Science student at Vellore Institute of Technology who likes building things with data,</text></g><clipPath id="c0"><rect x="44" y="144" width="0" height="26"><animate attributeName="width" from="0" to="1110" begin="0.35s" dur=".6s" fill="freeze"/></rect></clipPath><g clip-path="url(#c1)"><text x="44" y="188" class="p">AI and cloud tech.</text></g><clipPath id="c1"><rect x="44" y="168" width="0" height="26"><animate attributeName="width" from="0" to="1110" begin="0.75s" dur=".6s" fill="freeze"/></rect></clipPath><g clip-path="url(#c2)"><text x="44" y="224" class="p">I got into data engineering after wondering what actually happens to data before it reaches an ML model. That</text></g><clipPath id="c2"><rect x="44" y="204" width="0" height="26"><animate attributeName="width" from="0" to="1110" begin="1.15s" dur=".6s" fill="freeze"/></rect></clipPath><g clip-path="url(#c3)"><text x="44" y="248" class="p">rabbit hole led me into pipelines, AWS, Snowflake, ETL/ELT, real-time systems and analytics.</text></g><clipPath id="c3"><rect x="44" y="228" width="0" height="26"><animate attributeName="width" from="0" to="1110" begin="1.55s" dur=".6s" fill="freeze"/></rect></clipPath><g clip-path="url(#c4)"><text x="44" y="284" class="p">Find something interesting, go down the rabbit hole, build something with it.</text></g><clipPath id="c4"><rect x="44" y="264" width="0" height="26"><animate attributeName="width" from="0" to="1110" begin="1.95s" dur=".6s" fill="freeze"/></rect></clipPath><text x="44" y="314" class="lab">verified</text><text x="44" y="344" class="p"><tspan fill="#A8AEF5">✦ </tspan>AWS Certified Cloud Practitioner</text><text x="1156" y="344" class="p dim" text-anchor="end">Amazon  Aug 2026</text><text x="44" y="370" class="p"><tspan fill="#A8AEF5">✦ </tspan>Generative AI Professional</text><text x="1156" y="370" class="p dim" text-anchor="end">Oracle  Jul 2025</text><text x="44" y="396" class="p"><tspan fill="#A8AEF5">✦ </tspan>Security, Compliance &amp; Identity (SC-900)</text><text x="1156" y="396" class="p dim" text-anchor="end">Microsoft  Jun 2025</text><rect class="cur" x="44" y="418" width="10" height="16" fill="#cfe0c0"/><rect x="10" y="38" width="1180" height="408" fill="url(#scan)" pointer-events="none"/><rect x="10" y="38" width="1180" height="408" fill="url(#vig)"/><rect x="10" y="456" width="1180" height="24" fill="#1c1f14"/><text x="22" y="473" class="st">VIT Bhopal  class of 2027</text><text x="1178" y="473" class="st" text-anchor="end">Patna</text></svg>